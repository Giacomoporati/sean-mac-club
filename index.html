<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sean Mac Club – demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#06263A;--pool:#0C5F94;--aqua:#1FB5C9;--aqua-bg:#E3F6F9;--red:#D7263D;--red-bg:#FCE7EA;--yellow:#B07D00;--yellow-bg:#FFF4D1;--green:#11865A;--green-bg:#E2F5EC;--bg:#EEF4F7;--ink:#0B1F2A;--muted:#566B78;--line:#D5E1E8;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Barlow",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.45;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
.demo{background:var(--yellow-bg);color:#6B4D00;text-align:center;font-weight:600;font-size:13px;padding:6px 12px}
header{background:var(--deep);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.badge-club{width:46px;height:46px;border-radius:12px;background:var(--aqua);color:var(--deep);display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:22px;flex:none;border:none;cursor:pointer}
header .t{flex:1;min-width:0}
header h1{margin:0;font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:700;line-height:1.05}
header p{margin:2px 0 0;font-size:14px;color:#A9C6D6}
header button.sw{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.rope{height:8px;background:repeating-linear-gradient(90deg,var(--red) 0 16px,#fff 16px 22px,var(--pool) 22px 38px,#fff 38px 44px)}
main{max-width:680px;margin:0 auto;padding:18px 16px}
h2{font-family:"Barlow Condensed",sans-serif;font-size:32px;font-weight:700;margin:0 0 14px;line-height:1}
h3{font-family:"Barlow Condensed",sans-serif;font-size:21px;font-weight:700;margin:0 0 8px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}.small{font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .n{font-family:"Barlow Condensed",sans-serif;font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:14px;color:var(--muted);font-weight:600;margin-top:4px}
.stat.warn .n{color:var(--red)}.stat.good .n{color:var(--green)}
.btn{display:block;width:100%;border:none;border-radius:12px;min-height:50px;padding:10px 16px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-align:center;margin-top:10px}
.btn-main{background:var(--pool);color:#fff}
.btn-ghost{background:#fff;color:var(--pool);border:2px solid var(--pool)}
.btn-sm{display:inline-block;width:auto;min-height:38px;padding:6px 12px;font-size:14px;margin:0}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--deep);border-color:var(--deep);color:#fff}
.chip.ev{padding:5px 11px;font-size:14px}
.chip.ev.on{background:var(--aqua);border-color:var(--aqua);color:var(--deep)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.t-green{background:var(--green-bg);color:var(--green)}.t-red{background:var(--red-bg);color:var(--red)}.t-yellow{background:var(--yellow-bg);color:var(--yellow)}.t-blue{background:var(--aqua-bg);color:var(--pool)}.t-grey{background:#EDF1F4;color:#44525C}
.t-gold{background:#FFE9A8;color:#7A5500}.t-silver{background:#E6EAEE;color:#3E4A53}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:none}
.time{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.att{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:17px;cursor:pointer;margin-bottom:8px;text-align:left;color:var(--ink)}
.att .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.att.on{border-color:var(--green);background:var(--green-bg)}.att.on .box{background:var(--green);border-color:var(--green)}
.weeknav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.weeknav button{width:50px;height:50px;border:none;border-radius:12px;background:var(--deep);color:#fff;font-size:20px;cursor:pointer;flex:none}
.weeknav button:disabled{opacity:.3}
.weeknav .mid{flex:1;text-align:center}.weeknav strong{display:block;font-family:"Barlow Condensed",sans-serif;font-size:22px}
.field{margin-bottom:10px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
.inp{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.grid2f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{border-left:4px solid var(--aqua);padding:4px 0 4px 12px;margin:10px 0}
.notice .d{font-size:13px;color:var(--muted)}
.decl{display:flex;gap:8px}
.decl .btn{margin:0;min-height:42px}
.yes.on{background:var(--green);color:#fff;border-color:var(--green)}
.no.on{background:var(--red);color:#fff;border-color:var(--red)}
.bank{font-weight:700;background:var(--aqua-bg);border-radius:8px;padding:8px 10px;margin:4px 0 10px;letter-spacing:.02em}
.who{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:16px;cursor:pointer;margin-bottom:8px;text-align:left;color:var(--ink)}
.who .av{width:42px;height:42px;border-radius:10px;background:var(--aqua-bg);color:var(--pool);display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:20px;flex:none}
.who.staff .av{background:var(--deep);color:#fff}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:10}
.tabs button{flex:1;min-height:62px;border:none;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-top:3px solid transparent;position:relative}
.tabs button.on{color:var(--deep);border-top-color:var(--red);font-weight:700}
.tabs .ic{font-size:20px;line-height:1.15}
.dot{position:absolute;top:4px;right:22%;background:var(--red);color:#fff;border-radius:999px;font-size:11px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:var(--deep);color:#fff;border-radius:12px;padding:13px 16px;z-index:20;font-size:15px;font-weight:600}
.toast[hidden]{display:none}
.link{background:none;border:none;color:var(--pool);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px 0}
.sub{display:flex;background:#DDE8EE;border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.sub button{flex:1;border:none;background:transparent;border-radius:9px;padding:9px;font:inherit;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer}
.sub button.on{background:#fff;color:var(--deep)}
.chart{width:100%;height:auto;display:block}
.bd h4{margin:14px 0 6px;font-size:15px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-bottom:6px;background:#EDF1F4}
.bdrow{display:flex;align-items:center;gap:8px;font-size:15px;padding:3px 0}
.bdrow .sw{width:10px;height:10px;border-radius:50%;flex:none}
.bdrow .nm{flex:1}.bdrow .pc{color:var(--muted);width:44px;text-align:right}.bdrow .m{width:70px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .hd{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.cal .dy{min-width:0;min-height:60px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px;font:inherit;font-size:12px;text-align:left;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.cal .dy.out{opacity:.4}.cal .dy.today{border:2px solid var(--pool)}
.cal .pill{display:block;border-radius:4px;padding:1px 3px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setrow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.setrow .what{flex:1}.setrow .what b{font-size:17px}
.zone{display:inline-block;font-size:12px;font-weight:800;padding:1px 7px;border-radius:5px;color:#fff}
.grid3f{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid3f.ed{grid-template-columns:1.6fr 1.4fr 1fr}
.eq{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.eq label{display:flex;align-items:center;gap:5px;font-size:14px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 6px}
.coachonly{display:inline-block;font-size:12px;font-weight:700;background:var(--deep);color:#fff;border-radius:6px;padding:2px 8px;margin-left:6px;vertical-align:middle}
footer{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="demo">Demo · made-up swimmers and families · changes save in this browser only</div>
<div id="root"></div>
<div id="toast" class="toast" hidden></div>
<footer>Sean Mac Club · prototype v0.7</footer>
<script>
const KEY='seanMacClubDemo_v5';
const EVENTS=['50 Free','100 Free','200 Free','50 Back','100 Back','50 Breast','100 Breast','50 Fly','100 Fly','100 IM','200 IM'];
const MULT={'50 Free':1,'100 Free':2.2,'200 Free':4.75,'50 Back':1.12,'100 Back':2.45,'50 Breast':1.26,'100 Breast':2.75,'50 Fly':1.1,'100 Fly':2.5,'100 IM':2.5,'200 IM':5.3};
const SQUADS={dol:{name:'Dolphins',ages:'8–10',ses:[[1,'17:00','18:00'],[3,'17:00','18:00']]},
  sha:{name:'Sharks',ages:'11–13',ses:[[1,'18:00','19:00'],[3,'18:00','19:00'],[5,'18:00','19:00']]},
  per:{name:'Performance',ages:'14+',ses:[[2,'19:00','20:30'],[4,'19:00','20:30'],[6,'08:00','10:00']]}};
const STROKES=['Free','Back','Breast','Fly','IM','Choice'];
const ZONES={A1:{c:'#3B82C4',f:1,d:'Aerobic easy'},A2:{c:'#11865A',f:2,d:'Aerobic hard'},FAST:{c:'#E07A1F',f:3,d:'Threshold / fast'},MAX:{c:'#D7263D',f:4,d:'Race pace / max'}};
const KINDS=['Swim','Pull','Kick','Drill'];
const EQUIP=['Buoy','Paddles','Fins','Snorkel','Kickboard'];
const SCOL={Free:'#3B82C4',Back:'#11865A',Breast:'#E0A21F',Fly:'#D7263D',IM:'#7C5CD6',Choice:'#8A9BA6'};
const KCOL={Swim:'#3B82C4',Pull:'#E0A21F',Kick:'#11865A',Drill:'#7C5CD6'};
const ECOL={Buoy:'#8BC34A',Paddles:'#E07A1F',Fins:'#1FB5C9',Snorkel:'#3B82C4',Kickboard:'#7C5CD6'};
const REQUIRED_ROLES=['General Club – Chairperson','General Club – Secretary','General Club – Treasurer',"Club Children's Officer – Lead",'Head Coach','General Club – Complaints & Disciplinary Officer'];
const OPTIONAL_ROLES=['Committee member','Registrar','PRO'];
const COMMITTEE_ROLES=REQUIRED_ROLES.filter(r=>r!=='Head Coach').concat(OPTIONAL_ROLES);
const shortRole=r=>(r||'').replace('General Club – ','').replace("Club Children's Officer – Lead","Children's Officer (Lead)");
const missingRoles=()=>REQUIRED_ROLES.filter(r=>!db.staff.some(x=>x.committee===r));
const COACH_ROLES=['Coach','Swimming Teacher'];
const CMIN=6,CMAX=12;
const FEE=35, DAY=864e5, DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const BANK={name:'Sean Mac Club (sample)',iban:'IE00 SAMP 0000 0000 0000 00',bic:'SAMPIE00'};

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const fd=s=>pd(s).toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'});
const eur=n=>'€'+Number(n).toLocaleString('en-IE');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ft=h=>{if(h==null)return '—';const m=Math.floor(h/6000),s=(h%6000)/100;return m?m+':'+s.toFixed(2).padStart(5,'0'):s.toFixed(2)};
const pt=str=>{str=String(str).trim().replace(',','.');const m=str.match(/^(?:(\d+):)?(\d{1,2})(?:\.(\d{1,2}))?$/);if(!m)return null;const hs=(m[3]||'0').padEnd(2,'0');const v=(+(m[1]||0))*6000+(+m[2])*100+(+hs);return v>0?v:null};
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const monthName=d=>d.toLocaleDateString('en-IE',{month:'long',year:'numeric'});

function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}

function seed(){
  const R=rng(42), t=today(), T=ymd(t), yr=t.getFullYear();
  const fam=[['kel','Siobhán Kelly'],['byr','Mark Byrne'],['doy','Clare Doyle'],['mur','Paul Murphy'],['wal','Niamh Walsh'],['ros','Marco Rossi'],['nol','Emma Nolan'],['has','Leila Hassan'],['obr',"Dermot O'Brien"],['bre','Ciara Brennan']];
  const families=fam.map(([id,name],i)=>({id,name,email:name.split(' ')[0].toLowerCase()+'@example.com',ref:'SM-'+(1001+i)}));
  const S=(id,first,last,age,g,squad,familyId,consent)=>({id,first,last,born:yr-age,gender:g,squad,familyId,consent});
  const swimmers=[S('s1','Aoife','Kelly',9,'F','dol','kel',true),S('s2','Cian','Kelly',12,'M','sha','kel',true),S('s3','Saoirse','Byrne',10,'F','dol','byr',false),
    S('s4','Oisín','Doyle',13,'M','sha','doy',true),S('s5','Ella','Doyle',11,'F','sha','doy',true),S('s6','Fionn','Murphy',15,'M','per','mur',true),
    S('s7','Grace','Walsh',14,'F','per','wal',false),S('s8','Luca','Rossi',12,'M','sha','ros',true),S('s9','Hannah','Nolan',16,'F','per','nol',true),
    S('s10','Jack','Nolan',9,'M','dol','nol',true),S('s11','Amira','Hassan',11,'F','sha','has',true),S('s12',"Tadhg","O'Brien",15,'M','per','obr',false),
    S('s13','Zoe','Brennan',10,'F','dol','bre',true)];
  const results=[], meetsPast=[['Spring Time Trial',-170],['Summer Club Gala',-110],['Autumn Time Trial',-24]];
  swimmers.forEach(sw=>{
    const age=yr-sw.born, base=(50-(age-8)*2.5-(sw.gender==='M'?1.2:0))*100;
    const evs=EVENTS.filter(()=>R()<0.55).slice(0,6); if(!evs.includes('50 Free'))evs.unshift('50 Free');
    evs.forEach(ev=>{let tm=Math.round(base*MULT[ev]*(1.04+R()*0.08));
      meetsPast.forEach(([mn,off],k)=>{if(k===0&&R()<0.4)return;results.push({id:'r'+results.length,swimmerId:sw.id,event:ev,time:tm,date:addD(T,off),meet:mn});tm=Math.round(tm*(0.965+R()*0.03))});
    });
  });
  const sessions=[]; // attendance seeded for past 4 weeks
  const attendance={};
  for(let d=-28;d<=0;d++){const ds=addD(T,d),dw=pd(ds).getDay();
    Object.entries(SQUADS).forEach(([k,sq])=>{if(sq.ses.some(s=>s[0]===dw)&&d<0){attendance[k+'_'+ds]=Object.fromEntries(swimmers.filter(s=>s.squad===k&&R()<0.82).map(s=>[s.id,true]))}})}
  const meets=[
    {id:'m1',name:'Dublin Development Meet',venue:'Dublin (sample venue)',date:addD(T,20),deadline:addD(T,8),fee:7,events:['50 Free','100 Free','50 Back','50 Breast','50 Fly','100 IM'],decl:{s2:'yes',s4:'yes',s5:'no',s8:'yes',s11:'yes',s6:'yes',s9:'yes'},entries:{s2:['50 Free','100 Free'],s6:['100 Free','100 IM']},billed:{}},
    {id:'m2',name:'Sean Mac Christmas Gala',venue:'Sean McDermott Street pool',date:addD(T,45),deadline:addD(T,32),fee:5,events:EVENTS.slice(),decl:{s1:'yes',s3:'yes'},entries:{},billed:{}},
    {id:'m0',name:'Autumn Time Trial',venue:'Sean McDermott Street pool',date:addD(T,-24),deadline:addD(T,-31),fee:0,events:EVENTS.slice(),decl:{},entries:{},billed:{}}];
  const mPrev=new Date(t.getFullYear(),t.getMonth()-1,1), mNow=new Date(t.getFullYear(),t.getMonth(),1);
  const charges=[];
  families.forEach((f,i)=>{const kids=swimmers.filter(s=>s.familyId===f.id).length;
    charges.push({id:'c'+charges.length,familyId:f.id,desc:'Membership – '+monthName(mPrev)+(kids>1?' ('+kids+' swimmers)':''),amount:FEE*kids,status:i===3?'due':'paid',due:ymd(new Date(mPrev.getFullYear(),mPrev.getMonth(),7))});
    charges.push({id:'c'+charges.length,familyId:f.id,desc:'Membership – '+monthName(mNow)+(kids>1?' ('+kids+' swimmers)':''),amount:FEE*kids,status:i%3===0?'paid':'due',due:ymd(new Date(mNow.getFullYear(),mNow.getMonth(),7))});
  });
  const notices=[{id:'n1',date:addD(T,-2),text:'Pool closed this Saturday for maintenance. Performance squad: dryland session in the hall at 09:00 instead.'},
    {id:'n2',date:addD(T,-6),text:'Dublin Development Meet: please declare by '+fd(addD(T,8))+' in the Meets tab.'}];
  const library=[
    {id:'L1',name:'Warm-up 400',reps:1,dist:400,stroke:'Choice',zone:'A1',kind:'Swim',equip:[],note:'Easy, mix strokes'},
    {id:'L2',name:'Aerobic pull',reps:8,dist:100,stroke:'Free',zone:'A2',kind:'Pull',equip:['Buoy','Paddles'],note:'On 1:40'},
    {id:'L3',name:'Kick with fins',reps:6,dist:50,stroke:'Fly',zone:'A2',kind:'Kick',equip:['Fins'],note:'Underwater dolphin to 10m'},
    {id:'L4',name:'Race-pace 25s',reps:8,dist:25,stroke:'Free',zone:'MAX',kind:'Swim',equip:[],note:'Dive start, 1:00 rest'},
    {id:'L5',name:'IM drill',reps:4,dist:100,stroke:'IM',zone:'A1',kind:'Drill',equip:['Snorkel'],note:'25 drill / 25 swim'},
    {id:'L6',name:'Threshold 200s',reps:3,dist:200,stroke:'Free',zone:'FAST',kind:'Swim',equip:[],note:'Hold best average'},
    {id:'L7',name:'Swim-down',reps:1,dist:200,stroke:'Choice',zone:'A1',kind:'Swim',equip:[],note:''}];
  const pick=k=>{const l=library.find(x=>x.id===k);return {reps:l.reps,dist:l.dist,stroke:l.stroke,zone:l.zone,kind:l.kind,equip:l.equip.slice(),note:l.note}};
  const plans={dol:[['L1','L5','L3','L7'],['L1','L3','L4','L7']],sha:[['L1','L2','L3','L6','L7'],['L1','L5','L4','L7'],['L1','L2','L6','L7']],per:[['L1','L2','L6','L3','L4','L7'],['L1','L5','L2','L6','L7'],['L1','L2','L3','L6','L4','L7']]};
  const training=[]; let ti=0;
  for(let d=-35;d<=3;d++){const ds=addD(T,d),dw=pd(ds).getDay();
    Object.entries(SQUADS).forEach(([k,sq])=>{const si=sq.ses.findIndex(x=>x[0]===dw);if(si<0)return;
      const pl=plans[k][si%plans[k].length];
      training.push({id:'t'+(ti++),date:ds,squad:k,ampm:+sq.ses[si][1].slice(0,2)<12?'AM':'PM',title:sq.name+' – '+fd(ds),sets:pl.map(pick).map(x=>(R()<0.3?{...x,reps:x.reps+1}:x))});});}
  const staff=[

/* ---------- TRAINING (coach only) */
const setM=x=>x.reps*x.dist;
const sesM=t=>t.sets.reduce((a,x)=>a+setM(x),0);
const sesLoad=t=>Math.round(t.sets.reduce((a,x)=>a+setM(x)*ZONES[x.zone].f,0)/100);
const mondayOf=off=>{const d=today();const dw=(d.getDay()+6)%7;d.setDate(d.getDate()-dw+7*off);return ymd(d)};
const trList=()=>db.training.filter(t=>ui.trSquad==='all'||t.squad===ui.trSquad);
const setText=x=>x.text?x.text:(x.reps>1?x.reps+' × ':'')+x.dist+' '+x.stroke+(x.kind!=='Swim'?' '+x.kind.toLowerCase():'');
function vTraining(){
  if(ui.edit) return vEditor();
  let h=`<h2>Training <span class="coachonly">Coach only</span></h2>
  <div class="chips"><button class="chip ${ui.trSquad==='all'?'on':''}" data-act="trsq" data-k="all">All squads</button>${Object.entries(SQUADS).map(([k,s])=>`<button class="chip ${ui.trSquad===k?'on':''}" data-act="trsq" data-k="${k}">${s.name}</button>`).join('')}</div>
  <div class="sub">${[['week','Week'],['cal','Calendar'],['lib','Set library']].map(([k,l])=>`<button class="${ui.trView===k?'on':''}" data-act="trview" data-v="${k}">${l}</button>`).join('')}</div>`;
  if(ui.trView==='week') h+=vWeek(); else if(ui.trView==='cal') h+=vCal(); else h+=vLib();
  return h;
}
function vWeek(){
  const mon=mondayOf(ui.trWeek), days=[...Array(7)].map((_,i)=>addD(mon,i));
  const prevDays=days.map(d=>addD(d,-7));
  const L=trList(), wk=L.filter(t=>days.includes(t.date));
  const vol=wk.reduce((a,t)=>a+sesM(t),0), load=wk.reduce((a,t)=>a+sesLoad(t),0);
  const dv=days.map(d=>L.filter(t=>t.date===d).reduce((a,t)=>a+sesM(t),0)), pv=prevDays.map(d=>L.filter(t=>t.date===d).reduce((a,t)=>a+sesM(t),0));
  const dl=days.map(d=>L.filter(t=>t.date===d).reduce((a,t)=>a+sesLoad(t),0));
  const maxV=Math.max(1000,...dv,...pv), maxL=Math.max(10,...dl);
  const W=340,H=170,P=28,cw=(W-P-10)/7;
  const bars=days.map((d,i)=>{const x=P+i*cw;const ph=pv[i]/maxV*(H-40),ch=dv[i]/maxV*(H-40);
    return `<rect x="${x+cw*0.18}" y="${H-20-ph}" width="${cw*0.3}" height="${ph}" rx="2" fill="#C9DDEB"/><rect x="${x+cw*0.5}" y="${H-20-ch}" width="${cw*0.3}" height="${ch}" rx="2" fill="#0C5F94"/><text x="${x+cw/2}" y="${H-5}" font-size="11" text-anchor="middle" fill="#566B78">${DOW[pd(d).getDay()]}</text>`}).join('');
  const pts=days.map((d,i)=>[P+i*cw+cw/2,H-20-dl[i]/maxL*(H-40)]).filter((p,i)=>dl[i]>0);
  const line=pts.length>1?`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#E07A1F" stroke-width="2.5"/>`:'';
  const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#E07A1F"/>`).join('');
  const grid=[0,0.5,1].map(f=>`<line x1="${P}" x2="${W-6}" y1="${H-20-f*(H-40)}" y2="${H-20-f*(H-40)}" stroke="#E3EBF0"/><text x="${P-4}" y="${H-16-f*(H-40)}" font-size="10" text-anchor="end" fill="#8A9BA6">${Math.round(maxV*f/100)/10}k</text>`).join('');
  const bd=(title,key,cols)=>{const t={};wk.forEach(s=>s.sets.forEach(x=>{const ks=key==='equip'?x.equip:[x[key]];ks.forEach(k=>t[k]=(t[k]||0)+setM(x))}));
    const tot=Object.values(t).reduce((a,b)=>a+b,0)||1, base=key==='equip'?vol||1:tot, ent=Object.entries(t).sort((a,b)=>b[1]-a[1]);
    return `<h4>${title}</h4><div class="stack">${ent.map(([k,v])=>`<span style="width:${v/base*100}%;background:${cols[k]}"></span>`).join('')}</div>${ent.map(([k,v])=>`<div class="bdrow"><span class="sw" style="background:${cols[k]}"></span><span class="nm">${k}</span><span class="pc">${Math.round(v/base*100)}%</span><span class="m">${v.toLocaleString('en-IE')}m</span></div>`).join('')||'<p class="small muted" style="margin:0">—</p>'}`};
  return `<div class="weeknav"><button data-act="trwk" data-d="-1" aria-label="Previous week">◀</button><div class="mid"><strong>Week of ${fd(mon)}</strong><span class="small muted">${ui.trSquad==='all'?'All squads':SQUADS[ui.trSquad].name}</span></div><button data-act="trwk" data-d="1" aria-label="Next week">▶</button></div>
  <div class="stats" style="grid-template-columns:1fr 1fr 1fr"><div class="stat"><div class="n">${(vol/1000).toFixed(1)}k</div><div class="l">Metres</div></div><div class="stat"><div class="n">${load}</div><div class="l">Load</div></div><div class="stat"><div class="n">${wk.length}</div><div class="l">Sessions</div></div></div>
  <div class="card"><h3>Volume and load</h3><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Metres per day this week and last week, with training load">${grid}${bars}${line}${dots}</svg>
  <div class="small muted" style="display:flex;gap:14px;flex-wrap:wrap;margin-top:6px"><span><span class="sw" style="display:inline-block;width:10px;height:10px;background:#0C5F94;border-radius:2px"></span> This week</span><span><span style="display:inline-block;width:10px;height:10px;background:#C9DDEB;border-radius:2px"></span> Last week</span><span><span style="display:inline-block;width:14px;height:3px;background:#E07A1F;vertical-align:middle"></span> Load</span></div></div>
  <div class="card bd"><h3>Breakdown</h3>${bd('Energy zone','zone',Object.fromEntries(Object.entries(ZONES).map(([k,z])=>[k,z.c])))}${bd('Strokes','stroke',SCOL)}${bd('Composition','kind',KCOL)}${bd('Equipment','equip',ECOL)}</div>
  <div class="card"><h3>Sessions this week</h3><ul class="list">${wk.sort((a,b)=>a.date.localeCompare(b.date)).map(t=>`<li><span><b>${fd(t.date)} · ${t.ampm}</b><br><span class="small muted">${SQUADS[t.squad].name} · ${t.sets.length} sets</span></span><span style="text-align:right"><b>${sesM(t).toLocaleString('en-IE')}m</b><br><button class="link" data-act="opentr" data-id="${t.id}" style="padding:0">Open</button></span></li>`).join('')||'<li class="muted">No sessions planned.</li>'}</ul>
  <button class="btn btn-main" data-act="newtr" data-date="${ymd(today())}">➕ Plan a session</button></div>
  <p class="small muted">Load = metres × zone weight (A1 ×1, A2 ×2, FAST ×3, MAX ×4) ÷ 100.</p>`;
}
function vCal(){
  const base=today();base.setDate(1);base.setMonth(base.getMonth()+ui.trMonth);

function vLib(){
  return `<div class="card"><h3>Saved sets</h3><ul class="list">${db.library.map(l=>`<li><span><b>${esc(l.name)}</b> <span class="zone" style="background:${ZONES[l.zone].c}">${l.zone}</span><br><span class="small muted">${esc(setText(l))}${l.equip.length?' · '+l.equip.join(', '):''}${l.note?' · '+esc(l.note):''}</span></span><span style="text-align:right"><b>${setM(l)}m</b><br><button class="x" data-act="dellib" data-id="${l.id}" aria-label="Delete">×</button></span></li>`).join('')||'<li class="muted">No saved sets yet. Save one from the session builder.</li>'}</ul></div>`;

function parseLine(line){
  const L=line.trim(), lo=L.toLowerCase();
  let reps=1, dist=0, m=lo.match(/(\d+)\s*[x×*]\s*(\d+)/);
  if(m){reps=+m[1];dist=+m[2]}else{m=lo.match(/(?:^|\s)(\d{2,4})\s*m?(?=\s|$|[a-z])/);if(m&&+m[1]>=25)dist=+m[1]}
  const has=re=>re.test(lo);
  const stroke=has(/\b(im|medley)\b/)?'IM':has(/\b(fly|butterfly)\b/)?'Fly':has(/\b(breast|br|brs)\b/)?'Breast':has(/\b(back|bk|bc)\b/)?'Back':has(/\b(choice|ch|mix)\b/)?'Choice':has(/\b(free|fs|fr|freestyle)\b/)?'Free':'Choice';
  const zone=has(/\b(max|race|sprint|all out)\b/)?'MAX':has(/\b(fast|threshold|thr|hard)\b/)?'FAST':has(/\ba2\b/)?'A2':has(/\ba1\b|\beasy\b|\bwarm|\bswim.?down|\bcool/)?'A1':has(/\bmax\b/)?'MAX':has(/\ba3\b/)?'FAST':'A1';
  const kind=has(/\bpull\b/)?'Pull':has(/\bkick\b/)?'Kick':has(/\bdrill/)?'Drill':'Swim';
  const equip=[['Buoy',/\bbuoy\b/],['Paddles',/\bpaddles?\b/],['Fins',/\bfins?\b/],['Snorkel',/\bsnorkel\b/],['Kickboard',/\b(kick)?board\b/]].filter(([,r])=>r.test(lo)).map(([n])=>n);
  return {text:L,reps,dist,stroke,zone,kind,equip,note:''};
}
const lineOf=x=>x.text||((x.reps>1?x.reps+'x':'')+x.dist+' '+x.stroke+(x.kind!=='Swim'?' '+x.kind.toLowerCase():'')+' '+x.zone+(x.equip.length?' '+x.equip.join(' ').toLowerCase():'')+(x.note?' '+x.note:''));

  else if(a==='home'){ui.tab='home';ui.meet=null;window.scrollTo(0,0)}
  else if(a==='tab'){ui.tab=d.tab;ui.meet=null;ui.edit=null;window.scrollTo(0,0)}
  else if(a==='squad'){ui.squad=d.k;ui.ses=null}
  else if(a==='ses'){ui.ses+=Number(d.d)}
  else if(a==='att'){const at=db.attendance[d.key]=db.attendance[d.key]||{};if(at[d.id])delete at[d.id];else at[d.id]=true;save()}
  else if(a==='openmeet'){ui.tab='meets';ui.meet=d.id;window.scrollTo(0,0)}
  else if(a==='closemeet'){ui.meet=null}
  else if(a==='entry'){const m=db.meets.find(x=>x.id===ui.meet),l=m.entries[d.s]=m.entries[d.s]||[];const i=l.indexOf(d.ev);if(i>=0)l.splice(i,1);else l.push(d.ev);save()}
  else if(a==='billmeet'){const m=db.meets.find(x=>x.id===ui.meet);let n=0;
    db.swimmers.forEach(s=>{const amt=(m.entries[s.id]||[]).length*m.fee,prev=m.billed[s.id]||0;if(amt!==prev){
      db.charges=db.charges.filter(c=>!(c.meetKey===m.id+'_'+s.id&&c.status==='due'));
      const paidAmt=db.charges.filter(c=>c.meetKey===m.id+'_'+s.id).reduce((a,c)=>a+c.amount,0);
      if(amt-paidAmt>0)db.charges.push({id:'c'+Date.now()+s.id,familyId:s.familyId,meetKey:m.id+'_'+s.id,desc:m.name+' – '+s.first+' ('+(m.entries[s.id]||[]).length+' events)',amount:amt-paidAmt,status:'due',due:m.deadline});
      m.billed[s.id]=amt;n++}});save();toast(n?'Entries confirmed · '+n+' families billed':'Nothing changed since last time')}
  else if(a==='addmeet'){const n=val('mName'),dt=val('mDate'),dl=val('mDead');if(!n||!dt||!dl){toast('Fill in name, date and deadline');return}
    db.meets.push({id:'m'+Date.now(),name:n,venue:val('mVenue')||'—',date:dt,deadline:dl,fee:Number(val('mFee'))||0,events:EVENTS.slice(),decl:{},entries:{},billed:{}});save();toast('Meet created · parents can now declare')}
  else if(a==='decl'){const m=db.meets.find(x=>x.id===d.m);m.decl[d.s]=d.v;if(d.v==='no')delete m.entries[d.s];save();toast(d.v==='yes'?'Declared: swimming ✅':'Declared: not swimming')}
  else if(a==='pick'){ui.sw=d.id}
  else if(a==='addresult'){const t=pt(val('rTime')),ev=val('rEv');if(!t){toast('Time format: 1:15.61 or 33.54');return}
    const before=pb(ui.sw,ev);db.results.push({id:'r'+Date.now(),swimmerId:ui.sw,event:ev,time:t,date:val('rDate')||ymd(today()),meet:val('rMeet')||'Club time trial'});save();
    toast(!before||t<before.time?'🎉 New PB: '+ev+' '+ft(t):'Result saved')}
  else if(a==='billmonth'){const mN=monthName(today()),due=ymd(new Date(today().getFullYear(),today().getMonth(),7));
    db.families.forEach(f=>{const k=kidsOf(f.id).length;if(k)db.charges.push({id:'c'+Date.now()+f.id,familyId:f.id,desc:'Membership – '+mN+(k>1?' ('+k+' swimmers)':''),amount:FEE*k,status:'due',due})});save();toast(mN+' billed to all families')}
  else if(a==='fam'){ui.famOpen=ui.famOpen===d.id?null:d.id}
  else if(a==='paid'){const c=db.charges.find(x=>x.id===d.id);c.status=c.status==='paid'?'due':'paid';save();toast(c.status==='paid'?'Marked as paid':'Marked as not paid')}
  else if(a==='addnotice'){const t=val('noticeTxt');if(!t){toast('Write the notice first');return}db.notices.push({id:'n'+Date.now(),date:ymd(today()),text:t});save();toast('Notice posted')}
  else if(a==='delnotice'){db.notices=db.notices.filter(n=>n.id!==d.id);save()}
  else if(a==='addswimmer'){const fi=val('nFirst'),la=val('nLast'),bo=Number(val('nBorn'));if(!fi||!la||!bo){toast('Fill in name and year of birth');return}
    let fid=val('nFam');if(!fid){const pn=val('nParent');if(!pn){toast("Add the new parent's name");return}fid='f'+Date.now();db.families.push({id:fid,name:pn,email:'',ref:'SM-'+(1001+db.families.length)})}
    db.swimmers.push({id:'s'+Date.now(),first:fi,last:la,born:bo,gender:val('nGender'),squad:val('nSquad'),familyId:fid,consent:false});save();toast(fi+' added to '+SQUADS[val('nSquad')].name)}
  else if(a==='trsq'){ui.trSquad=d.k}
  else if(a==='trview'){ui.trView=d.v}
  else if(a==='trwk'){ui.trWeek+=Number(d.d)}
  else if(a==='trmo'){ui.trMonth+=Number(d.d)}
  else if(a==='newtr'){const sq=ui.trSquad==='all'?'sha':ui.trSquad;ui.draft={id:null,date:d.date||ymd(today()),squad:sq,ampm:'PM',title:'',sets:[]};ui.edit=true;window.scrollTo(0,0)}
  else if(a==='opentr'){const t=db.training.find(x=>x.id===d.id);if(!t)return;ui.draft=JSON.parse(JSON.stringify(t));ui.edit=true;window.scrollTo(0,0)}
  else if(a==='closetr'){ui.edit=null;ui.draft=null}
  else if(a==='addset'){const reps=Math.max(1,parseInt(val('sReps'),10)||1),dist=Math.max(25,parseInt(val('sDist'),10)||0);
    ui.draft.sets.push({reps,dist,stroke:val('sStroke'),zone:val('sZone'),kind:val('sKind'),equip:[...document.querySelectorAll('input[name=sEq]:checked')].map(x=>x.value),note:val('sNote')});toast('Set added')}
  else if(a==='addlib'){const l=db.library.find(x=>x.id===val('libPick'));if(!l){toast('Choose a saved set first');return}ui.draft.sets.push({reps:l.reps,dist:l.dist,stroke:l.stroke,zone:l.zone,kind:l.kind,equip:l.equip.slice(),note:l.note});toast(l.name+' added')}
  else if(a==='delset'){ui.draft.sets.splice(Number(d.i),1)}
  else if(a==='setup'){const i=Number(d.i),S_=ui.draft.sets;[S_[i-1],S_[i]]=[S_[i],S_[i-1]]}
  else if(a==='savelib'){const x=ui.draft.sets[Number(d.i)],n=prompt('Name for this set:',setText(x));if(!n)return;db.library.push({id:'L'+Date.now(),name:n,...JSON.parse(JSON.stringify(x))});save();toast('Saved to set library')}
  else if(a==='dellib'){if(!confirm('Delete this saved set?'))return;db.library=db.library.filter(l=>l.id!==d.id);save()}
  else if(a==='parse'){ui.draft.sets=val('sText').split('\n').filter(l=>l.trim()).map(parseLine);toast('Metres calculated')}
  else if(a==='savetr'){const t=ui.draft;if(document.getElementById('sText'))t.sets=val('sText').split('\n').filter(l=>l.trim()).map(parseLine);if(!t.sets.length){toast('Write at least one set');return}
    t.title=SQUADS[t.squad].name+' – '+fd(t.date);
    if(t.id){const i=db.training.findIndex(x=>x.id===t.id);db.training[i]=t}else{t.id='t'+Date.now();db.training.push(t)}
    save();ui.edit=null;ui.draft=null;toast('Session saved · '+sesM(t).toLocaleString('en-IE')+'m')}
  else if(a==='deltr'){if(!confirm('Delete this session?'))return;db.training=db.training.filter(x=>x.id!==ui.draft.id);save();ui.edit=null;ui.draft=null;toast('Session deleted')}
  else if(a==='addstaff'){if(!canManageTeam())return;const nmv=val('tName'),em=val('tEmail'),cr=val('tCom')||null,kr=val('tCoach')||null;
    if(!nmv){toast('Add a name');return} if(!cr&&!kr){toast('Choose a committee role or a coaching role');return}
    if(cr&&kr){toast('Only the Head Coach can be on the committee and the coaching staff. Choose one.');return}
    if(cr&&committee().length>=CMAX){toast('Committee is full (max '+CMAX+')');return}
    if(cr&&REQUIRED_ROLES.includes(cr)&&db.staff.some(y=>y.committee===cr)){toast(shortRole(cr)+' is already filled');return}
    if(!em){toast('Add an email: each person needs their own login');return}
    const same=db.staff.find(y=>(y.email||'').toLowerCase()===em.toLowerCase()||y.name.trim().toLowerCase()===nmv.toLowerCase());
    if(same){toast(same.name+' is already in the app ('+shortRole(same.committee||same.coach)+'). One person can only hold one committee role.');return}
    db.staff.push({id:'u'+Date.now(),name:nmv,email:em,committee:cr,coach:kr});save();toast(nmv+' added')}
  else if(a==='delstaff'){if(!canManageTeam())return;const x=db.staff.find(y=>y.id===d.id);if(!x)return;
    if(x.committee&&committee().length<=CMIN){toast('The committee needs at least '+CMIN+' members. Add someone first.');return}
    if(!confirm('Remove '+x.name+'?'+(REQUIRED_ROLES.includes(x.committee)?'\n\n'+shortRole(x.committee)+' is a required role: the club must fill it again.':'')))return;db.staff=db.staff.filter(y=>y.id!==d.id);save();toast(x.name+' removed')}
  else if(a==='reset'){if(!confirm('Reset all demo data?'))return;try{localStorage.removeItem(KEY)}catch(e){}db=seed();save();ui.who=null;toast('Demo reset')}
  else return;
  render();
});
document.addEventListener('change',e=>{if(e.target.dataset.change==='pick'){ui.sw=e.target.value;render()}
  if(e.target.dataset.change==='draft'&&ui.draft){ui.draft.date=val('eDate')||ui.draft.date;ui.draft.squad=val('eSquad');ui.draft.ampm=val('eAm')}});
render();
</script>
</body>
</html>
